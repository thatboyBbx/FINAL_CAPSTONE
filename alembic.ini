# alembic.ini — Alembic configuration for InsureIntel Zimbabwe
# Run migrations: alembic upgrade head
# Generate revision: alembic revision --autogenerate -m "description"

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The actual DATABASE_URL is always read from the environment (or .env file)
# by alembic/env.py via app.core.config.settings — this value is never used
# at runtime.  It exists only as a fallback for Alembic CLI introspection when
# env.py cannot be loaded.  Do not rely on it; set DATABASE_URL in .env instead.
#
# PostgreSQL example:
#   DATABASE_URL=postgresql://insureuser:secret@localhost:5432/insuredb
# SQLite example (local dev):
#   DATABASE_URL=sqlite:///./app.db
#
# One-off override (skips env.py entirely):
#   alembic -x sqlalchemy.url=postgresql://user:pw@host/db upgrade head
sqlalchemy.url = sqlite:///./app.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
