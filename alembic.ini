# alembic.ini — Alembic configuration for InsureIntel Zimbabwe
# Run migrations: alembic upgrade head
# Generate revision: alembic revision --autogenerate -m "description"

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Database URL — read from .env at runtime via env.py
# Override for one-off commands: alembic -x sqlalchemy.url=sqlite:///./test.db upgrade head
sqlalchemy.url = sqlite:///./app.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
