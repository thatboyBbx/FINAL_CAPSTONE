<!DOCTYPE html>
<html lang="en" id="html-root" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}InsureIntel Zimbabwe{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Tokens -> structural -> components -> utilities -> overrides -->
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/utilities.css">
  <link rel="stylesheet" href="/static/css/main.css">

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            headline: ["Manrope", "sans-serif"],
            body:     ["Inter",   "sans-serif"],
            label:    ["Inter",   "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "0.125rem",
            sm:  "0.25rem",
            lg:  "0.5rem",
            xl:  "1rem",
            full:"9999px",
          },
          backdropBlur: { xs:"2px", card:"12px" },
        },
      },
    }
  </script>

  <style>
    /* ═══════════════════════════════════════════════════════
       DESIGN TOKENS
       Dark  = Royal Gold Edition  (#d4af37 on #0f0f0f)
       Light = Victoria Falls Slate (#004ac6 on #f8f9fb)
    ═══════════════════════════════════════════════════════ */
    :root {
      --cp:   #d4af37;
      --cop:  #0f0f0f;
      --cbg:  #0f0f0f;
      --csf:  #1a1a1a;
      --csfc: #242424;
      --col:  #4a4a4a;
      --cos:  #f5f5f5;
      --cosv: #a1a1a1;
      --cerr: #ff4d4d;
      --sidebar-w:    250px;
      --topbar-h:     4rem;
      --sidebar-bg:   #0a0a0a;
      --sidebar-bdr:  rgba(212,175,55,0.15);
      --glass-bg:     rgba(26,26,26,0.6);
      --glass-bdr:    rgba(212,175,55,0.10);
      --glow:         rgba(212,175,55,0.10);
      --active-grad:  rgba(212,175,55,0.15);
    }
    html:not(.dark) {
      --cp:   #004ac6;
      --cop:  #ffffff;
      --cbg:  #f8f9fb;
      --csf:  #ffffff;
      --csfc: #edeef0;
      --col:  #737686;
      --cos:  #191c1e;
      --cosv: #434655;
      --cerr: #ba1a1a;
      --sidebar-bg:   #1a1f36;
      --sidebar-bdr:  rgba(0,74,198,0.18);
      --glass-bg:     rgba(255,255,255,0.85);
      --glass-bdr:    rgba(0,74,198,0.12);
      --glow:         rgba(0,74,198,0.08);
      --active-grad:  rgba(0,74,198,0.14);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--cbg);
      color: var(--cos);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    h1,h2,h3,.font-headline { font-family: 'Manrope', sans-serif; }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
      line-height: 1;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--col); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--cosv); }

    /* ── Sidebar nav ── */
    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 0.875rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--cosv);
      transition: all 0.15s ease;
      text-decoration: none;
      border-left: 3px solid transparent;
    }
    .nav-link:hover { color: var(--cp); background: rgba(255,255,255,0.04); }
    html:not(.dark) .nav-link:hover { background: rgba(0,0,0,0.04); }
    .nav-link.active {
      background: linear-gradient(90deg, var(--active-grad) 0%, transparent 100%);
      border-left-color: var(--cp);
      color: var(--cp);
    }
    .nav-section {
      padding: 1.25rem 0.875rem 0.375rem;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--col);
    }

    /* ── Cards ── */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-bdr);
      box-shadow: 0 4px 24px -1px rgba(0,0,0,0.2);
    }
    .gold-accent-glow { box-shadow: 0 0 18px var(--glow); }
    .stat-card { border-radius:0.75rem; padding:2rem; }

    /* ── Badges ── */
    .badge {
      display:inline-flex; align-items:center; gap:0.25rem;
      padding:0.2rem 0.625rem; border-radius:9999px;
      font-size:0.7rem; font-weight:700;
    }
    .badge-gold  { background:rgba(212,175,55,0.12); color:#d4af37; border:1px solid rgba(212,175,55,0.3); }
    .badge-green { background:rgba(74,222,128,0.12);  color:#4ade80; border:1px solid rgba(74,222,128,0.3); }
    .badge-red   { background:rgba(248,113,113,0.12); color:#f87171; border:1px solid rgba(248,113,113,0.3); }
    .badge-amber { background:rgba(251,191,36,0.12);  color:#fbbf24; border:1px solid rgba(251,191,36,0.3); }
    .badge-blue  { background:rgba(96,165,250,0.12);  color:#60a5fa; border:1px solid rgba(96,165,250,0.3); }
    html:not(.dark) .badge-gold { background:rgba(0,74,198,0.1); color:#004ac6; border-color:rgba(0,74,198,0.25); }

    /* ── Alerts ── */
    .alert { padding:0.875rem 1rem; border-radius:0.5rem; font-size:0.875rem; border-left:3px solid; }
    .alert-error   { background:rgba(255,77,77,0.08);    color:#f87171; border-color:#ff4d4d; }
    .alert-success { background:rgba(74,222,128,0.08);   color:#4ade80; border-color:#4ade80; }
    .alert-warn    { background:rgba(212,175,55,0.08);   color:#d4af37; border-color:#d4af37; }
    .alert-info    { background:rgba(96,165,250,0.08);   color:#60a5fa; border-color:#60a5fa; }
    html:not(.dark) .alert-error   { background:#fff1f0; color:#ff4d4f; border-color:#ffccc7; }
    html:not(.dark) .alert-success { background:rgba(0,100,60,0.06);   color:#006438; }
    html:not(.dark) .alert-warn    { background:rgba(100,73,0,0.06);   color:#644900; }
    html:not(.dark) .alert-info    { background:rgba(0,74,198,0.06);   color:#004ac6; }
    .error-visible {
      color:#ff4d4f; background:#fff1f0;
      border:1px solid #ffccc7; border-radius:4px; padding:8px 12px;
    }

    /* ── Buttons ── */
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:0.5rem;
      padding:0.625rem 1.25rem; border-radius:8px; min-height:40px;
      font-size:0.875rem; font-weight:600; cursor:pointer;
      border:none; transition:all 0.15s ease;
      text-decoration:none; white-space:nowrap;
    }
    .btn-primary   { background:var(--cp); color:var(--cop); }
    .btn-primary:hover { opacity:0.88; }
    .btn-secondary { background:var(--glass-bg); color:var(--cp); border:1px solid var(--glass-bdr); }
    .btn-secondary:hover { border-color:var(--cp); }
    .btn-ghost     { background:transparent; color:var(--cosv); }
    .btn-ghost:hover { background:rgba(255,255,255,0.06); color:var(--cos); }
    html:not(.dark) .btn-ghost:hover { background:rgba(0,0,0,0.05); }
    .btn-danger    { background:transparent; color:var(--cerr); }
    .btn-danger:hover { background:rgba(239,68,68,0.1); }
    .btn-sm { padding:0.375rem 0.875rem; font-size:0.75rem; min-height:32px; }
    .btn-lg { padding:0.875rem 1.75rem;  font-size:0.9375rem; min-height:48px; }

    /* ── Forms ── */
    .form-label {
      display:block; font-size:0.75rem; font-weight:600;
      color:var(--cosv); margin-bottom:0.5rem;
      text-transform:uppercase; letter-spacing:0.06em;
    }
    .form-input {
      width:100%; padding:0.625rem 0.875rem; border-radius:8px;
      font-size:0.875rem; color:var(--cos); min-height:44px;
      background:var(--csfc); border:1px solid var(--col);
      outline:none; transition:border-color 0.15s;
    }
    .form-input:focus { border-color:var(--cp); box-shadow:0 0 0 3px var(--glow); }
    textarea.form-input { resize:vertical; min-height:100px; }

    /* ── Tables ── */
    .data-table { width:100%; border-collapse:collapse; }
    .data-table thead th {
      padding:0.625rem 1rem; font-size:0.65rem; font-weight:700;
      text-transform:uppercase; letter-spacing:0.1em;
      color:var(--cosv); text-align:left;
      background:rgba(255,255,255,0.03);
    }
    html:not(.dark) .data-table thead th { background:rgba(0,0,0,0.03); }
    .data-table tbody tr { border-bottom:1px solid rgba(255,255,255,0.04); transition:background 0.1s; }
    html:not(.dark) .data-table tbody tr { border-bottom-color:rgba(0,0,0,0.06); }
    .data-table tbody tr:hover { background:rgba(212,175,55,0.04); }
    html:not(.dark) .data-table tbody tr:hover { background:rgba(0,74,198,0.04); }
    .data-table tbody td { padding:0.75rem 1rem; font-size:0.875rem; color:var(--cos); }

    /* ── Progress ── */
    .progress-track { height:6px; background:rgba(255,255,255,0.08); border-radius:9999px; overflow:hidden; }
    html:not(.dark) .progress-track { background:rgba(0,0,0,0.08); }
    .progress-fill  { height:100%; background:var(--cp); border-radius:9999px; transition:width 0.4s ease; }

    /* ── Theme icon toggle ── */
    html.dark       .icon-dark-mode  { display:none; }
    html:not(.dark) .icon-light-mode { display:none; }

    /* ── HTMX loading states ── */
    .htmx-indicator { opacity:0; transition:opacity 0.2s ease; pointer-events:none; }
    .htmx-request .htmx-indicator,
    .htmx-request.htmx-indicator  { opacity:1; pointer-events:auto; }

    /* Dim the target element while a request is in-flight */
    .htmx-request[hx-target],
    .htmx-request [hx-target] { opacity:0.6; }

    /* Button spinner on htmx-request */
    button.htmx-request,
    a.htmx-request {
      position:relative; pointer-events:none; opacity:0.7;
    }
    button.htmx-request::after,
    a.htmx-request::after {
      content:'';
      position:absolute; right:0.75rem; top:50%; transform:translateY(-50%);
      width:14px; height:14px; border-radius:50%;
      border:2px solid currentColor; border-top-color:transparent;
    }

    /* ── Responsive: sidebar hidden on mobile ── */
    @media (max-width: 1023px) {
      #sidebar { transform:translateX(-100%); transition:transform 0.25s ease; }
      #sidebar.mobile-open { transform:translateX(0); }
      #main-wrapper { margin-left:0 !important; }
      #sidebar-overlay { display:block; }
      #sidebar-hamburger { display:flex; }
    }
    @media (min-width: 1024px) {
      #sidebar { transform:none !important; }
      #sidebar-hamburger { display:none; }
    }

    /* Mobile sidebar overlay */
    #sidebar-overlay {
      display:none; position:fixed; inset:0; z-index:49;
      background:rgba(0,0,0,0.5); backdrop-filter:blur(2px);
    }
    #sidebar-overlay.active { display:block; }

    {% block head_styles %}{% endblock %}
  </style>

  {% block head %}{% endblock %}

  <!-- Prevent theme flash — synchronous, before render -->
  <script>
    (function () {
      var t = localStorage.getItem('insureIntelTheme') || 'dark';
      if (t !== 'dark') document.documentElement.classList.remove('dark');
    })();
  </script>
</head>

<body>

  <!-- Skip to main content (first focusable element — visible on keyboard focus) -->
  <a href="#main-content"
     class="sr-only focusable"
     style="position:absolute;top:1rem;left:1rem;z-index:99999;
            background:var(--cp);color:var(--cop);
            padding:0.5rem 1rem;border-radius:6px;font-weight:700;
            text-decoration:none;font-size:0.875rem">
    Skip to main content
  </a>

  <!-- Fixed top progress bar — controlled via showProgress() in api.js -->
  <div id="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"></div>

  <!-- Sidebar (extracted partial) -->
  {% include "partials/sidebar.html" %}

  <!-- Main area -->
  <div style="margin-left:var(--sidebar-w)" class="min-h-screen flex flex-col" id="main-wrapper">

    <!-- Topbar (extracted partial) -->
    {% include "partials/topbar.html" %}

    <!-- Page content — primary HTMX swap target -->
    <main class="flex-1" id="main-content"
          hx-history-elt>
      {% block content %}{% endblock %}
    </main>

  </div>

  <!-- Mobile sidebar overlay -->
  <div id="sidebar-overlay" onclick="mobileSidebarClose()"></div>

  <!-- Global Error Modal -->
  <div id="globalErrorModal"
       class="hidden fixed inset-0 flex items-center justify-center z-50 modal-backdrop"
       role="dialog" aria-modal="true" aria-labelledby="gemTitle" aria-describedby="gemMsg">
    <div class="glass-card rounded-lg p-6 max-w-md w-full mx-4" style="max-width:28rem">
      <h2 id="gemTitle" class="text-lg font-bold font-headline" style="color:var(--cerr)"></h2>
      <p class="text-sm mt-2" id="gemMsg" style="color:var(--cos)"></p>
      <p class="text-xs mt-3 font-semibold" id="gemAction" style="color:var(--cp)"></p>
      <button onclick="closeModal('globalErrorModal')"
              class="btn btn-secondary mt-4 text-sm">
        OK
      </button>
    </div>
  </div>

  <!-- Out-of-band HTMX swap targets (toast, modals, etc.) -->
  <div id="oob-toast-target" style="display:none"></div>
  {% block oob_targets %}{% endblock %}

  <!-- Toast container -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script>
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('insureIntelTheme', isDark ? 'dark' : 'light');
    }

    function mobileSidebarOpen() {
      document.getElementById('sidebar').classList.add('mobile-open');
      const ov = document.getElementById('sidebar-overlay');
      if (ov) ov.classList.add('active');
    }
    function mobileSidebarClose() {
      document.getElementById('sidebar').classList.remove('mobile-open');
      const ov = document.getElementById('sidebar-overlay');
      if (ov) ov.classList.remove('active');
    }
    function toggleSidebar() {
      const sb = document.getElementById('sidebar');
      sb.classList.contains('mobile-open') ? mobileSidebarClose() : mobileSidebarOpen();
    }

    function showGlobalError(type, msg, action) {
      document.getElementById('gemTitle').textContent  = type   || 'Error';
      document.getElementById('gemMsg').textContent    = msg    || 'An unexpected error occurred.';
      document.getElementById('gemAction').textContent = action || 'Please try again.';
      if (typeof openModal === 'function') {
        openModal('globalErrorModal');
      } else {
        document.getElementById('globalErrorModal').classList.remove('hidden');
      }
    }

    window.addEventListener('unhandledrejection', function(evt) {
      if (evt.reason && evt.reason.isGlobalError) {
        showGlobalError(evt.reason.type, evt.reason.msg, evt.reason.action);
        evt.preventDefault();
      }
    });

    /* Show topbar loading indicator during HTMX requests */
    document.addEventListener('htmx:beforeRequest', function() {
      const el = document.getElementById('htmx-indicator');
      if (el) el.style.opacity = '1';
    });
    document.addEventListener('htmx:afterRequest', function() {
      const el = document.getElementById('htmx-indicator');
      if (el) el.style.opacity = '0';
    });
    document.addEventListener('htmx:responseError', function(evt) {
      const status = evt.detail?.xhr?.status;
      const msgs = { 401:'Session expired — please log in again.',
                     403:'You do not have permission for this action.',
                     404:'The requested resource was not found.',
                     500:'A server error occurred. Please try again.' };
      showGlobalError('Request Failed', msgs[status] || 'An unexpected error occurred.', 'HTTP ' + status);
    });

    /* After HTMX swaps content, move focus to the swapped region's first
       focusable element (or the region itself) so keyboard users are not
       left behind on the previous position. */
    document.addEventListener('htmx:afterSwap', function(evt) {
      const target = evt.detail.target;
      if (!target) return;
      const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
      const first = target.querySelector(FOCUSABLE);
      if (first) {
        first.focus({ preventScroll: true });
      } else if (target !== document.getElementById('main-content')) {
        target.setAttribute('tabindex', '-1');
        target.focus({ preventScroll: true });
      }
    });
  </script>

  {% block scripts %}{% endblock %}

  <!-- Global JS layer (defer = parse during HTML download, execute in order after parse) -->
  <script defer src="/static/js/theme-toggle.js"></script>
  <script defer src="/static/js/api.js"></script>
  <script defer src="/static/js/sidebar.js"></script>

  <!-- HTMX — defer so config runs after htmx loads -->
  <script defer src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js" crossorigin="anonymous"></script>
  <script defer>
    /* Global HTMX configuration */
    htmx.config.defaultSwapStyle     = 'innerHTML';
    htmx.config.defaultSettleDelay   = 80;
    htmx.config.historyCacheSize     = 10;
    htmx.config.globalViewTransitions = false;
    htmx.config.requestClass          = 'htmx-request';
    htmx.config.indicatorClass        = 'htmx-indicator';
  </script>

</body>
</html>
